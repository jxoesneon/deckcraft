[package]
name = "deckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft desktop app — sovereign Martensite runtime"
publish = false
default-run = "deckcraft"

[lints]
workspace = true

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-martensite = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# Icon + VERSIONINFO for deckcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/deckcraft", dest = "/usr/bin/deckcraft", mode = "755" }
]
